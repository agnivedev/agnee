name: Test & Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Sebagian test (inbound-log, follow-up-reenable) sengaja menyentuh Postgres
    # asli, bukan tiruan — yang diuji adalah perilaku SQL-nya sendiri (UNIQUE,
    # DISTINCT ON, transisi enabled false->true). Tanpa DATABASE_URL kedua test
    # itu dilewati diam-diam, jadi tenant-isolation dan billing-gate di jalur
    # itu tidak pernah benar-benar diperiksa CI.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: agnee_ci
          POSTGRES_PASSWORD: agnee_ci
          POSTGRES_DB: agnee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agnee_ci:agnee_ci@localhost:5432/agnee_ci
      CREDENTIALS_ENCRYPTION_KEY: ci-test-key-not-used-in-prod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      # Terpisah dari "Run tests" supaya schema_migrations sudah terisi penuh
      # SEBELUM file test yang menyentuh Postgres asli jalan berbarengan —
      # migrate() tidak pakai advisory lock, jadi dua koneksi yang sama-sama
      # menerapkan migrasi yang sama pada saat bersamaan bisa saling tabrakan.
      - name: Apply database migrations
        run: |
          node -e "
            const Database = require('./src/database');
            new Database({ connectionString: process.env.DATABASE_URL })
              .connect()
              .then(() => process.exit(0))
              .catch((err) => { console.error(err); process.exit(1); });
          "

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
          # Build-nya berjalan DI DALAM sesi SSH ini, jadi nasib deploy terikat
          # pada satu koneksi TCP yang harus bertahan selama build. Pada 21 Sep
          # koneksi itu putus di menit ke-13 (`Broken pipe`, exit 255) saat
          # Chromium sedang diunduh ulang dari mirror Debian yang merangkak.
          # Keepalive menahan koneksi menganggur, dan batas 20x30 detik memberi
          # ruang 10 menit tanpa balasan sebelum menyerah.
          #
          # Langkah di server ada di deploy/remote-deploy.sh — `git pull` di
          # bawah ini membawa versinya yang terbaru sebelum dijalankan.
          ssh -i ~/.ssh/deploy_key \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              $DEPLOY_USER@$DEPLOY_HOST \
              "cd /opt/agnee && git pull origin main && bash deploy/remote-deploy.sh"

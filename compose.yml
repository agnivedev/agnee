services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agnee
      POSTGRES_USER: agnee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnee -d agnee"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      args:
        # Ditanam ke dalam image sebagai /app/.git-sha, lalu diperiksa ulang
        # oleh deploy/remote-deploy.sh. Lihat Dockerfile untuk alasannya.
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    stop_grace_period: 20s
    # From inside this machine the public address bounces to the outer host
    # (certificate for radmond.com); host-gateway reaches the local nginx,
    # which serves app.insight.agnive.co itself. Used for the Hub feed (9c).
    extra_hosts:
      - "app.insight.agnive.co:host-gateway"
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: agnee
      PGUSER: agnee
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - whatsapp-session:/data/whatsapp
      - playbook-uploads:/data/playbooks
    shm_size: 512mb
    # Chromium + Node sudah memakai ~635 MB hanya dengan SATU company
    # tersambung. Pada 768m, sinkronisasi akun yang punya backlog menembus
    # plafon, renderer kena OOM-kill, dan client tidak pernah sampai 'ready'.
    # Nilai ini pernah dinaikkan manual di VPS tetapi tidak ada di repo,
    # sehingga `git reset --hard` saat memperbaiki CI membuangnya dan deploy
    # berikutnya mengunci balik ke 768m. Ditulis di sini supaya tidak hilang lagi.
    #
    # 10 Okt: 1536m dan 0,75 CPU tidak cukup untuk empat nomor. AL Gold FX
    # sendiri ±1,3 GB (ratusan chat, grup besar); memori menyentuh plafon
    # 12.641 kali dalam 16 menit (2 OOM-kill) dan CPU tertahan di 70% periode,
    # jadi halaman WhatsApp tidak menjawab dan nomornya restart berulang.
    # Server punya 2 CPU / 3,9 GB. Diterapkan live dengan `docker update`.
    mem_limit: 2560m
    memswap_limit: 5120m
    cpus: 1.75
    # Chromium memecah diri jadi banyak proses; 256 terlalu dekat dengan
    # pemakaian nyata (136 PID hanya untuk satu company).
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mcp:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    command: ["node", "src/mcp-http.mjs"]
    # Tidak butuh extra_hosts untuk Insight: alat Hub di MCP memanggil feed
    # lewat `app`, bukan langsung.
    env_file: .env
    environment:
      MCP_API_BASE_URL: http://app:4100
      # Only nginx can reach this port (bound to 127.0.0.1), so its
      # X-Forwarded-For is the visitor. Without this every visitor shares one
      # sign-in failure counter and a few wrong passwords lock everyone out.
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - mcp-state:/data/mcp
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  whatsapp-session:
  playbook-uploads:
  mcp-state:
  postgres-data:

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agnee
      POSTGRES_USER: agnee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnee -d agnee"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: agnee
      PGUSER: agnee
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - whatsapp-session:/data/whatsapp
    shm_size: 512mb
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mcp:
    build: .
    restart: unless-stopped
    command: ["node", "src/mcp-http.mjs"]
    env_file: .env
    environment:
      MCP_API_BASE_URL: http://app:4100
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - mcp-state:/data/mcp
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  whatsapp-session:
  mcp-state:
  postgres-data:

services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: .env
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - whatsapp-session:/data/whatsapp
    shm_size: 512mb
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mcp:
    build: .
    restart: unless-stopped
    command: ["node", "src/mcp-http.mjs"]
    env_file: .env
    environment:
      MCP_API_BASE_URL: http://app:4100
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - mcp-state:/data/mcp
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  whatsapp-session:
  mcp-state:

server {
    listen 80;
    listen [::]:80;
    server_name agnee.agnive.co app.agnee.agnive.co mcp.agnee.agnive.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

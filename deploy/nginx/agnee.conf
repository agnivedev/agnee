server {
    listen 80;
    listen [::]:80;
    server_name agnee.agnive.co app.agnee.agnive.co mcp.agnee.agnive.co;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agnee.agnive.co;
    ssl_certificate /etc/letsencrypt/live/agnee.agnive.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agnee.agnive.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 302 https://app.agnee.agnive.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.agnee.agnive.co;
    ssl_certificate /etc/letsencrypt/live/agnee.agnive.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agnee.agnive.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.agnee.agnive.co;
    ssl_certificate /etc/letsencrypt/live/agnee.agnive.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agnee.agnive.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

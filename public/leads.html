<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14241f">
  <title>Agnee — Lead List</title>
  <link rel="icon" href="/brand/agnee-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/leads.css">
</head>
<body data-i18n-title="leads.title">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/" aria-label="Kembali ke Agnee Inbox">
        <img src="/brand/agnee-mark.svg" alt="">
        <span><strong>Agnee</strong><small>Lead List</small></span>
      </a>

      <nav aria-label="Navigasi">
        <a href="/"><span>◇</span><b>Inbox</b></a>
        <a href="/leads" aria-current="page"><span>▤</span><b>Lead List</b></a>
        <a href="/settings"><span>◈</span><b>Pengaturan</b></a>
      </nav>

      <div class="sidebar-foot">
        <span id="sidebarDot" class="status-dot"></span>
        <div><strong id="sidebarName">Memuat…</strong><small id="sidebarRole">—</small></div>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <p class="eyebrow">LEAD LIST</p>
          <h1>Semua percakapan dan statusnya</h1>
          <p>Satu baris per percakapan, digabung dari pesan masuk, balasan, lead, dan penugasan.</p>
        </div>
        <a class="back-link" href="/#inbox">← Kembali ke inbox</a>
      </header>

      <section class="team-card" style="margin-top:32px">
        <div class="lead-toolbar">
          <input id="leadSearch" type="search" placeholder="Cari nomor, nama, isi pesan, PIC…" aria-label="Cari lead">
          <select id="leadStage" aria-label="Saring tahap lead">
            <option value="">Semua tahap</option>
          </select>
          <select id="leadHandling" aria-label="Saring penanganan">
            <option value="">AI &amp; manusia</option>
            <option value="AI">Hanya AI</option>
            <option value="Manusia">Hanya manusia</option>
          </select>
          <span class="lead-count" id="leadCount"></span>
          <span class="lead-spacer"></span>
          <button id="exportXlsx" class="save-settings-btn" type="button">Unduh XLSX</button>
          <button id="exportCsv" class="edit-btn" type="button">Unduh CSV</button>
          <button id="leadRefresh" class="edit-btn" type="button">Muat ulang</button>
        </div>

        <p id="leadStatus" class="team-status" style="margin:.5rem 0 0">Memuat…</p>

        <div class="lead-table-wrap">
          <table class="lead-table">
            <thead><tr id="leadHead"></tr></thead>
            <tbody id="leadBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/i18n.js"></script>
  <script src="/ui-dialog.js"></script>
  <script src="/leads.js"></script>
</body>
</html>
